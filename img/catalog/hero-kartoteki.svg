<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 552" preserveAspectRatio="xMidYMin slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a1a1a"/><stop offset=".45" stop-color="#1c1c1c"/><stop offset="1" stop-color="#232323"/>
    </linearGradient>
    <radialGradient id="glow" cx="1060" cy="470" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ea5901" stop-opacity=".34"/><stop offset=".55" stop-color="#ea5901" stop-opacity=".07"/><stop offset="1" stop-color="#ea5901" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34373b"/><stop offset=".5" stop-color="#2a2d30"/><stop offset="1" stop-color="#1f2123"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b3f44"/><stop offset="1" stop-color="#2b2e32"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ea5901" stop-opacity="0"/><stop offset="1" stop-color="#ff8a3d" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a1a1a" stop-opacity=".95"/><stop offset=".5" stop-color="#1a1a1a" stop-opacity=".5"/><stop offset="1" stop-color="#1a1a1a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ea5901" stop-opacity="0"/><stop offset="1" stop-color="#ea5901" stop-opacity=".16"/>
    </linearGradient>
    <linearGradient id="bottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1a1a" stop-opacity="0"/><stop offset="1" stop-color="#1a1a1a"/>
    </linearGradient>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="#fff" stroke-opacity=".035"/>
    </pattern>
    <g id="drawer">
      <rect width="190" height="82" rx="3" fill="url(#front)" stroke="#4a4e54" stroke-width="1"/>
      <rect x="62" y="12" width="66" height="22" rx="2" fill="#16181a" stroke="#555a61"/>
      <rect x="68" y="16" width="54" height="14" rx="1" fill="#e9e6df" opacity=".85"/>
      <rect x="70" y="52" width="50" height="8" rx="4" fill="#15171a" stroke="#656a72"/>
      <rect x="72" y="54" width="46" height="2.5" rx="1.2" fill="#8d939b" opacity=".7"/>
    </g>
  </defs>
  <rect width="1440" height="552" fill="url(#bg)"/>
  <rect width="1440" height="552" fill="url(#grid)"/>
  <rect width="1440" height="552" fill="url(#glow)"/>
  <!-- пол -->
  <rect y="430" width="1440" height="122" fill="url(#floor)"/>
  <!-- ряд картотечных шкафов -->
  <g transform="translate(830 130) scale(.74)">
    <!-- задний шкаф -->
    <g transform="translate(310 -22) scale(.88)" opacity=".55">
      <rect x="-8" y="-10" width="226" height="408" rx="4" fill="url(#body)"/>
      <g transform="translate(10 6)"><use href="#drawer"/></g>
      <g transform="translate(10 94)"><use href="#drawer"/></g>
      <g transform="translate(10 182)"><use href="#drawer"/></g>
      <g transform="translate(10 270)"><use href="#drawer"/></g>
    </g>
    <!-- главный шкаф -->
    <g transform="translate(60 0)">
      <rect x="-14" y="-14" width="218" height="450" rx="5" fill="url(#body)" stroke="#4a4e54"/>
      <rect x="196" y="-10" width="3" height="440" fill="url(#rim)"/>
      <g transform="translate(0 0)"><use href="#drawer"/></g>
      <g transform="translate(0 88)"><use href="#drawer"/></g>
      <g transform="translate(0 176)"><use href="#drawer"/></g>
      <g transform="translate(0 264)"><use href="#drawer"/></g>
      <g transform="translate(0 352)"><use href="#drawer"/></g>
      <rect x="-14" y="440" width="218" height="6" rx="2" fill="#16181a"/>
    </g>
    <!-- соседний шкаф, подсвечен -->
    <g transform="translate(300 40)">
      <rect x="-14" y="-14" width="218" height="410" rx="5" fill="url(#body)" stroke="#4a4e54"/>
      <rect x="196" y="-10" width="3" height="400" fill="url(#rim)"/>
      <g transform="translate(0 0)"><use href="#drawer"/></g>
      <g transform="translate(0 88)"><use href="#drawer"/></g>
      <g transform="translate(0 176)"><use href="#drawer"/></g>
      <g transform="translate(0 264)"><use href="#drawer"/></g>
      <rect x="-14" y="400" width="218" height="6" rx="2" fill="#16181a"/>
    </g>
  </g>
  <!-- затемнение слева под заголовок и снизу для перехода -->
  <rect width="1440" height="552" fill="url(#fade)"/>
  <rect y="400" width="1440" height="152" fill="url(#bottom)"/>
</svg>
